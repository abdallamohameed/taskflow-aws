services:
  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    restart: unless-stopped
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: ./frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - taskflow-network

    depends_on:
      backend:
        condition: service_healthy


networks:

  taskflow-network:
    driver: bridge